    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-blog">
    <div class="container py-4">
        <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm rounded-4 border border-2 border-warning-subtle">
            <div class="container-fluid px-3 py-2">
                <a class="navbar-brand blog-title text-primary fw-bold" href="index.php">Blogoteca</a>
                <div class="navbar-nav ms-auto flex-row gap-3">
                    <a class="nav-link" href="index.php">Início</a>
                    <a class="nav-link" href="feed.php">Feed</a>
                    <a class="nav-link active" href="cadastro.html">Cadastro</a>
                    <a class="nav-link" href="login.php">Login</a>
                    <a class="nav-link" href="sobre.html">Sobre</a>
                </div>
            </div>
        </nav>
    </div>
    <main class="container mb-5">
        <section class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <h1 class="blog-title text-primary display-5">Crie sua conta</h1>
            <p class="lead">Participe da rede, publique textos e converse com outras pessoas.</p>
            <form id="formCadastro" action="processar_cadastro.php" method="post" class="row g-3" novalidate>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="nome">Nome</label>
                    <input class="form-control" id="nome" name="nome" maxlength="150" autocomplete="name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold" for="email">E-mail</label>
                    <input class="form-control" type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold" for="senha">Senha</label>
                    <input class="form-control" type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold" for="nascimento">Data de nascimento</label>
                    <input class="form-control" type="date" id="nascimento" name="nascimento">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold" for="telefone">Telefone</label>
                    <input class="form-control" type="tel" id="telefone" name="telefone" maxlength="30" autocomplete="tel">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold" for="site-favorito">Site pessoal (opcional)</label>
                    <input class="form-control" type="url" id="site-favorito" name="site-favorito" maxlength="2048" placeholder="https://exemplo.com">
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold" for="mensagem">Sobre você (opcional)</label>
                    <textarea class="form-control" id="mensagem" name="mensagem" rows="4" maxlength="1000"></textarea>
                </div>
                <div class="col-12 form-check">
                    <input class="form-check-input" type="checkbox" id="termos" name="termos" required>
                    <label class="form-check-label" for="termos">Aceito fazer parte da Blogoteca.</label>
                </div>
                <div id="mensagemCadastro" class="alert alert-warning mt-3" hidden></div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Criar conta</button>
                    <button class="btn btn-outline-secondary" type="reset">Limpar</button>
                </div>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
